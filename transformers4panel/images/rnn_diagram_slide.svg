</g>

<text class="ts" x="40" y="508">   …  (repeated for each year in the sequence, up to t = 8)</text>

<!-- ══════════════════════════════════════════════ -->
<!-- SECTION C – OUTPUT                             -->
<!-- ══════════════════════════════════════════════ -->
<line x1="40" y1="516" x2="700" y2="516" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="4 4"/>
<text class="ts" x="40" y="528">③ Output at each step — probability over the 940 possible next enrolments</text>

<g class="c-blue">
  <rect x="40" y="534" width="618" height="40" rx="3"/>
  <text class="th" x="349" y="549" text-anchor="middle" dominant-baseline="central">P(next course-type | past trajectory, covariates)</text>
  <text class="ts" x="349" y="563" text-anchor="middle" dominant-baseline="central">vector of 940 probabilities — trained with cross-entropy loss against observed next enrolment</text>
</g>

