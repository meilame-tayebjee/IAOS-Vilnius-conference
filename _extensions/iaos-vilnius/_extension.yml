title: IAOS Vilnius 2026 Revealjs Format
author: IAOS Vilnius Conference
version: 1.0.0
quarto-required: ">=1.4.0"
contributes:
  formats:
    revealjs:
      theme: iaos-theme.scss
      logo: images/logo-iaos.png
      width: 1280
      height: 720
      margin: 0.05
      slide-number: "c/t"
      show-slide-number: all
      transition: fade
      background-transition: fade
      title-slide-attributes:
        data-background-image: images/bg-title.png
        data-background-size: cover
        data-background-position: right center
      filters:
        - section-bg.lua
resources:
  - images/
